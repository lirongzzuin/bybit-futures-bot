[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bybit-futures-bot"
version = "1.0.0"
description = "Bybit USDT Perpetual Futures Automated Trading Bot"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["src/backtest/data_loader.py"]  # requires API

[tool.ruff]
line-length = 100
target-version = "py311"
