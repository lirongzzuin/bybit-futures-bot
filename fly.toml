# fly.toml app configuration file generated for bybit-futures-bot on 2026-02-20T15:03:17+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "bybit-futures-bot"
primary_region = "nrt"

[build]

[env]
  TZ = "Asia/Seoul"
  PYTHONUNBUFFERED = "1"

[mounts]
  source = "bot_data"
  destination = "/app/data"

[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1